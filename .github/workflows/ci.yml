name: Django CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: pip
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r pprxweb/requirements.txt
    - name: Check for missing migrations
      working-directory: pprxweb
      # makemigrations is not a test run, so settings still require these env vars.
      env:
        DJANGO_SECRET_KEY: ci-placeholder
        CLIENT_ID: ci-placeholder
        CLIENT_SECRET: ci-placeholder
        GOOGLE_USERNAME: ci-placeholder
        GOOGLE_APP_PASSWORD: ci-placeholder
      run: python manage.py makemigrations --check --dry-run
    - name: Run tests
      working-directory: pprxweb
      run: python manage.py test
    - name: Run tests with unreachable DATABASE_URL
      working-directory: pprxweb
      env:
        DATABASE_URL: mysql://user:pass@203.0.113.1:3306/pprx
      run: python manage.py test
